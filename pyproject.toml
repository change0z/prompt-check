[project]
name = "prompt-check"
version = "0.1.0"
description = "POC: categorise malicous prompts for security trend analysis"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.45",
    "sentencepiece>=0.2",
    "protobuf>=5.0",
    "anthropic>=1.0",
    "graphql-core>=3.2",
    "gliner2[train]>=2.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
demo = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

